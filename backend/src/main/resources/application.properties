spring.application.name=txnoryx-backend

spring.datasource.url=jdbc:mysql://localhost:3306/txnoryx?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql26

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

txnoryx.safety.fraud-block=80
txnoryx.safety.risk-review=70
txnoryx.safety.max-retries=3
txnoryx.safety.confidence-review=60
txnoryx.safety.amount-threshold=100000

txnoryx.economic.retry-cost=10
txnoryx.economic.friction=5
txnoryx.economic.route-cost-enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
txnoryx.mail.from=${GMAIL_USER:}
txnoryx.mail.enabled=${MAIL_ENABLED:true}